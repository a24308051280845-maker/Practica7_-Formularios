<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 2 - Contraseñas</title>
</head>
<body>
    <h2>Formulario 2: Autenticación con contraseña</h2>
    <!-- Formulario típico para inicio de sesión o registro -->
    <form action="" method="post">
        <label for="usuario">Ingresa tu usuario:</label>
        <input type="text" id="usuario" name="usuario"><br><br>
        
        <!-- 'type="password"' enmascara la entrada del usuario reemplazando caracteres por puntos -->
        <label for="pass">Ingresa tu contraseña:</label>
        <input type="password" id="pass" name="pass"><br><br>
        
        <input type="submit" value="Enviar">
        <!-- 'type="reset"' restablece todos los campos del formulario a sus valores originales -->
        <input type="reset" value="Borrar">
    </form>
</body>
</html>
