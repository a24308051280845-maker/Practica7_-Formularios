<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 1 - Ejemplo Básico</title>
</head>
<body>
    <h2>Formulario 1: Ejemplo básico</h2>
    <!-- Formulario básico que envía texto simple usando POST -->
    <form action="" method="post">
        <!-- El atributo 'for' enlaza la etiqueta con el 'id' del campo para mejorar la accesibilidad -->
        <label for="nombre_basico">Ingresa tu nombre:</label>
        
        <!-- Input de texto donde 'size="20"' define el ancho visual en número de caracteres -->
        <input type="text" id="nombre_basico" name="nombre" size="20">
        <br><br>
        
        <!-- Botón submit para enviar los datos recopilados al servidor -->
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
