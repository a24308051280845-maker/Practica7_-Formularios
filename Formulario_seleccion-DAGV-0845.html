<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 6 - Select</title>
</head>
<body>
    <h2>Formulario 6: Menú desplegable</h2>
    <form action="" method="post">
        <label for="nombre_select">Ingresa tu nombre:</label>
        <input type="text" id="nombre_select" name="nombre"><br><br>
        
        <!-- Elemento '<select>' despliega un menú contextual con opciones representadas por '<option>' -->
        <label for="pais">Selecciona tu país:</label>
        <select id="pais" name="pais">
            <option value="1">Argentina</option>
            <option value="2">España</option>
            <option value="3">México</option>
            <option value="4">Guatemala</option>
            <option value="5">Honduras</option>
            <option value="6">El Salvador</option>
            <option value="7">Venezuela</option>
            <option value="8">Colombia</option>
        </select><br><br>
        
        <input type="submit" value="Enviar">
        <input type="reset" value="Borrar">
    </form>
</body>
</html>
