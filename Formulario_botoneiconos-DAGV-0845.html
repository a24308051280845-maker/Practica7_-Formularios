<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario 7 - Botones con Íconos</title>
    <!-- Inclusión de Font Awesome para cargar íconos dentro de las etiquetas <button> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <h2>Formulario 7: Botones enriquecidos con CSS/Íconos</h2>
    <form action="" method="post">
        <label for="nombre_btn">Ingresa tu nombre:</label>
        <input type="text" id="nombre_btn" name="nombre"><br><br>
        
        <!-- Las etiquetas '<button>' aceptan elementos hijos como íconos Font Awesome (<i>) -->
        <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
        <button type="reset">Borrar <i class="fa-solid fa-trash"></i></button>
    </form>
</body>
</html>
